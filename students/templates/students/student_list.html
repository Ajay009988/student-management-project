<!DOCTYPE html>
<html><head><title>Student List</title><style>body{font-family:Arial;padding:20px}table{border-collapse:collapse;width:80%}th,td{border:1px solid black;padding:8px}th{background:lightblue}a{padding:8px 15px;background:green;color:white;text-decoration:none}</style></head><body><h1>Student Management System</h1><a href="/add/">+ Add New Student</a><br><br><table><tr><th>Name</th><th>Roll No</th><th>Course</th><th>Email</th></tr>{% for s in students %}<tr><td>{{ s.name }}</td><td>{{ s.roll_no }}</td><td>{{ s.course }}</td><td>{{ s.email }}</td></tr>{% endfor %}</table></body></html>
